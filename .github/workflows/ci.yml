name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request supersedes the run already in flight, and
  # nothing downstream waits on the older one. Push events are exempt: a push
  # run is the record that a given commit passed, so it always finishes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy langchain_string tests
      - run: make lint_imports
      - run: make check_imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest tests/unit_tests
      - run: uv build

  # langchain-tests needs langchain-core 1.x, so the declared floor runs the
  # package's own tests only.
  langchain-core-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
      - run: uv venv
      - run: uv pip install -e . "langchain-core==0.3.60" pytest pytest-asyncio pytest-socket
      - run: uv run --no-sync pytest tests/unit_tests/test_tools.py
